<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Decision Check · Portfolio Insider</title><meta name="description" content="A free, self-reported portfolio scenario check. No account connection."><style>

</style><main><header><a id="back" href="vi.html">← Decision Check</a><nav><a href="manual.html?lang=en">EN</a> · <a href="manual.html?lang=vi">VI</a> · <a href="manual.html?lang=zh">中文</a></nav></header><h1 id="title"></h1><p id="intro"></p><span class="tag" id="free"></span><p class="warning" id="privacy"></p><form id="manual-form"><section><h2 id="step1"></h2><div class="fields"><label><span id="product-label"></span><select id="product"><option value="spot">Spot</option><option value="futures">USDT Futures · linear</option></select></label><label><span id="intent-label"></span><select id="intent"></select></label><label><span id="asset-label"></span><input id="asset" value="OKB" maxlength="20" required pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,19}"></label><label><span id="venue-label"></span><input id="venue" value="OKX" maxlength="80" required></label><label class="full"><span id="profile-label"></span><select id="profile"></select></label></div><p class="hint" id="frames"></p></section><section><h2 id="step2"></h2><div class="fields"><label><span id="qty-label"></span><input id="qty" type="number" value="10" min="0" max="1000000000" step="any" required></label><label><span id="price-label"></span><input id="price" type="number" value="80" min="0.00000001" max="1000000000" step="any" required></label></div><div id="spot-fields" class="fields" style="margin-top:16px"><label><span id="cost-label"></span><input id="cost" type="number" value="1000" min="0" step="0.01" required></label><label><span id="cash-label"></span><input id="cash" type="number" value="1200" min="0" step="0.01" required></label><label><span id="other-label"></span><input id="other" type="number" value="0" min="0" step="0.01" required></label><label><span id="buy-label"></span><input id="buy" type="number" value="400" min="0" step="0.01" required></label><label><span id="reserve-label"></span><input id="reserve" type="number" value="1000" min="0" step="0.01" required></label><label><span id="limit-label"></span><input id="limit" type="number" value="60" min="0" max="100" step="any" required></label></div><div id="futures-fields" class="fields" style="margin-top:16px" hidden><label><span id="direction-label"></span><select id="direction"><option value="LONG">LONG</option><option value="SHORT">SHORT</option></select></label><label><span id="entry-label"></span><input id="entry" type="number" value="100" min="0.00000001" max="1000000000" step="any"></label><label class="full"><span id="wallet-label"></span><input id="wallet" type="number" value="1200" min="0" step="0.01"></label></div><div class="fields" style="margin-top:16px"><label><span id="scenarioPrice-label"></span><input id="scenarioPrice" type="number" value="60" min="0.00000001" max="1000000000" step="any" required></label><label><span id="budget-label"></span><input id="budget" type="number" value="300" min="0" step="0.01" required></label></div><p id="assumptions" class="hint"></p><button id="check" type="submit"></button><button id="alternative" class="secondary" type="button"></button><p id="error" class="error" role="alert"></p></section></form><section id="output" hidden aria-live="polite"><h2 id="result-title"></h2><p id="status"></p><div id="metrics" class="metrics"></div><ul id="checks" class="checks"></ul><p id="explanation"></p><p class="warning" id="market-status"></p><details><summary id="plan-title"></summary><pre id="plan"></pre></details><button id="export" type="button"></button><button id="clear" type="button" class="secondary"></button><p><a id="reports" href="report.html?lang=vi"></a></p></section><footer id="footer"></footer></main><script type="module" src="manual.js"></script></html>
